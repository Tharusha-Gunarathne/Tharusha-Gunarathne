name: Update README

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['data/**', 'templates/**', 'internal/**', 'cmd/**']
  schedule:
    - cron: '30 18 * * 0'   # every Monday 00:00 Sri Lanka time

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Falls back to the built-in token if you haven't added a PAT secret.
      GH_ACCESS_TOKEN: ${{ secrets.GH_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
      SHOW_LATEST_POSTS: false
    steps:
      - name: Checkout repository 🛎
        uses: actions/checkout@v4

      - name: Set up Go 🚀
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate card + README 🔨
        run: go run ./cmd/gen

      - name: Commit changes 📝
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "🤖 Update README"
          git push
